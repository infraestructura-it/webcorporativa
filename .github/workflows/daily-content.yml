name: Daily AI Content Generation

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate all content'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # ← FIX 1: evita que se cuelgue 6 horas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # ← FIX 2: eliminado el cache npm (causaba el fallo de 14s)
          #   si quieres cache, primero haz "npm install" y commitea el package-lock.json

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Generate daily content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate }}
        run: |
          set -e                          # ← FIX 3: aborta si cualquier comando falla
          cd scripts
          echo "→ Iniciando generate-content.js"
          node generate-content.js
          echo "→ generate-content.js completado"

      - name: Build site
        run: |
          set -e
          cd scripts
          echo "→ Iniciando build-site.js"
          node build-site.js
          echo "→ build-site.js completado"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "InfraestructuraIT Bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore: daily content update $(date +'%Y-%m-%d')"
          git push
